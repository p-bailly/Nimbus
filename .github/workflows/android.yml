# Construit l'APK signé et le publie dans la release « apk » du dépôt, à chaque envoi sur la
# branche par défaut (ou à la demande : onglet Actions › APK Android › Run workflow).
# Lien permanent : https://github.com/p-bailly/Nimbus/releases/latest/download/Nimbus.apk
#
# Secrets du dépôt nécessaires (Settings › Secrets and variables › Actions) :
#   NIMBUS_KEYSTORE_BASE64    keystore PKCS12 (alias « nimbus ») encodé en base64
#   NIMBUS_KEYSTORE_PASSWORD  son mot de passe
# Toujours la même clé : Android refuse une mise à jour signée avec une autre clé.
name: APK Android

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

# Une file par branche : un push sur une autre branche n'annule pas la publication en cours.
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    # Uniquement sur la branche par défaut du dépôt.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Historique complet : le numéro de version est le nombre de commits.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.NIMBUS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NIMBUS_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Secrets NIMBUS_KEYSTORE_BASE64 et NIMBUS_KEYSTORE_PASSWORD manquants (voir CLAUDE.md, « Version, signature, release »)"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nimbus.jks"
          echo "NIMBUS_KEYSTORE_FILE=$RUNNER_TEMP/nimbus.jks" >> "$GITHUB_ENV"

      - name: Tests et compilation de l'APK
        env:
          NIMBUS_KEYSTORE_PASSWORD: ${{ secrets.NIMBUS_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk Nimbus.apk

      - name: Publication dans la release « apk »
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Nimbus 1.0.$(git rev-list --count HEAD), construit automatiquement depuis ${GITHUB_SHA::7} (build n°${GITHUB_RUN_NUMBER})."
            echo
            echo "Dernières modifications :"
            git log -5 --format='- %s'
          } > notes.md
          if gh release view apk >/dev/null 2>&1; then
            gh release upload apk Nimbus.apk --clobber
            gh release edit apk --title "Nimbus – APK Android" --notes-file notes.md --latest
          else
            gh release create apk Nimbus.apk --target "$GITHUB_SHA" --latest \
              --title "Nimbus – APK Android" --notes-file notes.md
          fi
