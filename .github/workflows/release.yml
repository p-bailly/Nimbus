# Publie une release GitHub avec l'APK signé, à chaque tag « v… » (ex. v1.2.0) poussé,
# ou à la demande (onglet Actions › Release › Run workflow, avec un numéro de version).
#
# Secrets du dépôt nécessaires (Settings › Secrets and variables › Actions) :
#   NIMBUS_KEYSTORE_BASE64    keystore PKCS12 (alias « nimbus ») encodé en base64
#   NIMBUS_KEYSTORE_PASSWORD  son mot de passe
# Toujours la même clé : Android refuse une mise à jour signée avec une autre clé.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (ex. 1.2.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION#v}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+(\.[0-9]+)*$'; then
            echo "::error::Version invalide : « $version » (attendu : 1.2.0)"
            exit 1
          fi
          echo "NIMBUS_VERSION_NAME=$version" >> "$GITHUB_ENV"
          # Toujours croissant d'une release à l'autre.
          echo "NIMBUS_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"

      - name: Clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.NIMBUS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NIMBUS_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Secrets NIMBUS_KEYSTORE_BASE64 et NIMBUS_KEYSTORE_PASSWORD manquants (voir le README, section Releases)"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nimbus.jks"
          echo "NIMBUS_KEYSTORE_FILE=$RUNNER_TEMP/nimbus.jks" >> "$GITHUB_ENV"

      - name: Compilation
        env:
          NIMBUS_KEYSTORE_PASSWORD: ${{ secrets.NIMBUS_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="Nimbus-$TAG.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "$TAG" "$apk" --title "Nimbus $TAG" --generate-notes --target "$GITHUB_SHA"
